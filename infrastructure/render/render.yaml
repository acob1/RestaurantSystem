# Select this path when creating a Blueprint. Replace account-specific values in Render.
services:
  - type: web
    name: restaurant-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__Origins__0
        sync: false
      - key: Paystack__Mode
        value: Test
      - key: Payments__AllowLivePayments
        value: "false"
  - type: web
    name: restaurant-admin
    runtime: static
    branch: main
    autoDeployTrigger: "off"
    rootDir: frontend/restaurant-admin
    buildCommand: npm ci && node scripts/write-config.mjs && npm run build
    staticPublishPath: dist/restaurant-admin/browser
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: PUBLIC_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /config.json
        name: Cache-Control
        value: no-store
  - type: web
    name: restaurant-n8n
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./automation/Dockerfile
    dockerContext: ./automation
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PORT
        value: "10000"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "2"
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: N8N_HOST
        sync: false
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PROXY_HOPS
        value: "1"
